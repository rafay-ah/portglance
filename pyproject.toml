[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portglance"
dynamic = ["version"]
description = "See which dev servers are listening on your Linux machine, at a glance."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "rafay-ah" }]
requires-python = ">=3.10"
keywords = ["ports", "developer-tools", "gnome", "gtk4", "libadwaita", "docker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: System :: Networking :: Monitoring",
]
# The GUI needs PyGObject with GTK 4 and libadwaita typelibs, which are best
# installed from the distribution (python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1).
# The core library and the `portglance list` / `portglance kill` commands
# need nothing beyond the standard library.
dependencies = []

[project.optional-dependencies]
gui = ["PyGObject>=3.46"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
portglance = "portglance.cli:main"

[project.urls]
Homepage = "https://github.com/rafay-ah/portglance"
Issues = "https://github.com/rafay-ah/portglance/issues"

[tool.setuptools.dynamic]
version = { attr = "portglance.__version__" }

[tool.setuptools.packages.find]
include = ["portglance*"]

[tool.setuptools.package-data]
portglance = ["data/**/*", "ui/*.css", "shell-extension/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM105"]
