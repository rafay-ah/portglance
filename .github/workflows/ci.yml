name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Core tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest

  gtk:
    name: Full suite with GTK 4 (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK 4, libadwaita and a headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-pytest gir1.2-gtk-4.0 gir1.2-adw-1 \
            adwaita-icon-theme librsvg2-common xvfb xauth dbus-x11 \
            desktop-file-utils appstream
      - name: Run all tests, including the GTK smoke test
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 -m pytest
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate data/io.github.rafay_ah.PortGlance.desktop
          appstreamcli validate --no-net data/io.github.rafay_ah.PortGlance.metainfo.xml
