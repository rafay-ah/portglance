name: Release

# Builds the .deb and the AppImage and publishes them as a GitHub release:
# - push a vX.Y.Z tag, or
# - run the workflow from the Actions tab with a tag (created on the selected
#   branch when it does not exist yet), or
# - publish a release in the web UI, which gets the files attached.
# Running it without a tag only keeps the packages as workflow artifacts.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

# A release made in the web UI can also push its tag: run one at a time.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build .deb and AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # with tags, to build an existing tag's commit

      - name: Select the release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [ -n "$tag" ] && git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            git checkout -q "refs/tags/$tag"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Building ${tag:-packages only} from $(git rev-parse --short HEAD)"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-pytest gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-girepository-2.0 \
            adwaita-icon-theme librsvg2-common libgdk-pixbuf2.0-bin dconf-gsettings-backend \
            libglib2.0-bin shared-mime-info desktop-file-utils appstream lintian \
            xvfb xauth dbus-x11 curl file

      - name: Check the tag matches the version
        if: env.TAG != ''
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' portglance/__init__.py)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match __version__ $version"
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md ||
            { echo "::error::CHANGELOG.md has no entry for $version"; exit 1; }
          grep -q "<release version=\"$version\"" data/*.metainfo.xml ||
            { echo "::error::The AppStream metadata has no release $version"; exit 1; }

      - name: Test
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 -m pytest

      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate data/io.github.rafay_ah.PortGlance.desktop
          appstreamcli validate --no-net data/io.github.rafay_ah.PortGlance.metainfo.xml

      - name: Build the .deb
        run: |
          bash packaging/deb/build-deb.sh
          lintian --fail-on error dist/*.deb

      - name: Build the AppImage
        run: bash packaging/appimage/build-appimage.sh

      - name: Smoke-test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          appimage="$(ls dist/*.AppImage)"
          "$appimage" --version
          "$appimage" list --all
          dbus-run-session -- xvfb-run -a "$appimage" doctor
          # Start the app in demo mode for a few seconds and make sure it
          # neither crashes nor logs a Python traceback.
          set +e
          timeout 15 dbus-run-session -- xvfb-run -a "$appimage" --demo > demo.log 2>&1
          status=$?
          set -e
          cat demo.log
          [ "$status" -eq 124 ] || { echo "::error::demo exited with $status"; exit 1; }
          ! grep -q "Traceback" demo.log

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: portglance-packages
          path: dist/*
          if-no-files-found: error

      - name: Publish the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # The notes are the version's CHANGELOG.md entry. --target only
            # matters when the tag does not exist yet: it is created there.
            awk -v heading="## [${TAG#v}]" '
              index($0, heading) == 1 { found = 1; next }
              found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
            gh release create "$TAG" dist/* --target "$RELEASE_SHA" \
              --title "PortGlance ${TAG#v}" --notes-file release-notes.md
          fi
